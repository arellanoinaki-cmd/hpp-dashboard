<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPP Philippines — Partner Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Honolulu">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
(function(){
  try{
    var t = localStorage.getItem('hpp_theme');
    if(t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#F5F5F7; --card-bg:#FFFFFF; --input-bg:#F2F2F5;
    --card-shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 28px rgba(0,0,0,.06);
    --card-border:1px solid rgba(0,0,0,.045);
    --hairline:rgba(0,0,0,.08);
    --text:#1D1D1F; --text-secondary:#6E6E73; --text-tertiary:#98989D;
    --accent:#2E7DC0; --accent-hover:#256BA3; --accent-glow:none;
    --accent-tint:rgba(46,125,192,.10); --accent-tint-strong:rgba(46,125,192,.16);
    --green:#2FA360; --green-tint:rgba(47,163,96,.12);
    --amber:#C98A2E; --amber-tint:rgba(201,138,46,.14);
    --red:#D6483D; --red-tint:rgba(214,72,61,.11);
    --header-bg:#0A0A0B; --header-text:#FFFFFF; --header-text-dim:rgba(255,255,255,.58);
    --header-control-bg:rgba(255,255,255,.08); --header-control-hover:rgba(255,255,255,.14);
    --radius-lg:20px; --radius-md:16px; --radius-sm:12px;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"]{
    --bg:#000000; --card-bg:#1C1C1E; --input-bg:#2C2C2E;
    --card-shadow:0 0 0 1px rgba(255,255,255,.055);
    --card-border:1px solid rgba(255,255,255,.07);
    --hairline:rgba(255,255,255,.09);
    --text:#F5F5F7; --text-secondary:#98989D; --text-tertiary:#6E6E73;
    --accent:#4FA6E8; --accent-hover:#6BB6EE;
    --accent-glow:0 0 16px rgba(79,166,232,.35);
    --accent-tint:rgba(79,166,232,.14); --accent-tint-strong:rgba(79,166,232,.22);
    --green:#3ED67D; --green-tint:rgba(62,214,125,.14);
    --amber:#E3A24E; --amber-tint:rgba(227,162,78,.15);
    --red:#FF6C63; --red-tint:rgba(255,108,99,.15);
    --header-bg:#000000; --header-text:#FFFFFF; --header-text-dim:rgba(255,255,255,.5);
    --header-control-bg:rgba(255,255,255,.09); --header-control-hover:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',Arial,sans-serif;color:var(--text);transition:background-color .3s var(--ease),color .3s var(--ease);}
  .wrap{max-width:960px;margin:0 auto;padding:0 0 5rem;}
  header{background:var(--header-bg);color:var(--header-text);padding:1.75rem 1.75rem 0;transition:background-color .3s var(--ease);}
  .brand{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;}
  .brand h1{font-weight:700;font-size:21px;margin:0;letter-spacing:-.01em;}
  .brand .sub{color:var(--header-text-dim);font-size:13px;margin-top:3px;}
  .brand .brand-left{display:flex;align-items:center;gap:14px;}
  .brand .logo-mark{height:36px;width:auto;flex-shrink:0;}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--header-text-dim);}
  .who select{background:var(--header-control-bg);color:#fff;border:none;border-radius:10px;padding:7px 12px;font-size:13px;transition:background-color .2s var(--ease);}
  .who select:hover{background:var(--header-control-hover);}
  .theme-toggle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--header-control-bg);border:none;color:#fff;cursor:pointer;transition:background-color .2s var(--ease),transform .15s var(--ease);flex-shrink:0;}
  .theme-toggle:hover{background:var(--header-control-hover);}
  .theme-toggle:active{transform:scale(.9);}
  .theme-toggle svg{width:17px;height:17px;}
  nav{display:flex;gap:4px;margin-top:1.5rem;overflow-x:auto;}
  nav button{background:transparent;border:none;color:var(--header-text-dim);font-family:inherit;font-weight:500;font-size:14px;padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s var(--ease),border-color .2s var(--ease);}
  nav button.active{color:#fff;border-bottom:2px solid var(--accent);}
  main{padding:2rem 1.75rem;opacity:1;transform:translateY(0);transition:opacity .28s var(--ease),transform .28s var(--ease);}
  main.fade{opacity:0;transform:translateY(6px);}
  .kitchen-line{border:none;border-top:1px solid var(--hairline);margin:2.5rem 0;}
  h2{font-size:20px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em;}
  .section-desc{color:var(--text-secondary);font-size:13.5px;margin:0 0 1.5rem;line-height:1.5;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;}
  .card{background:var(--card-bg);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--radius-lg);padding:20px 22px;transition:background-color .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease);}
  .card .label{font-size:12.5px;color:var(--text-secondary);margin-bottom:8px;font-weight:500;}
  .card .value{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .card .value.green{color:var(--green);} .card .value.amber{color:var(--amber);} .card .value.red{color:var(--red);}
  .card .value.blue{color:var(--accent);text-shadow:var(--accent-glow);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;padding:12px 14px;border-bottom:1px solid var(--hairline);white-space:nowrap;}
  td{padding:13px 14px;border-bottom:1px solid var(--hairline);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .tbl-scroll{overflow-x:auto;border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--radius-lg);background:var(--card-bg);transition:background-color .3s var(--ease),box-shadow .3s var(--ease);}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;}
  .badge.in{background:var(--green-tint);color:var(--green);}
  .badge.low{background:var(--amber-tint);color:var(--amber);}
  .badge.out{background:var(--red-tint);color:var(--red);}
  .badge.paid{background:var(--green-tint);color:var(--green);}
  .badge.partial{background:var(--amber-tint);color:var(--amber);}
  .badge.pending{background:var(--red-tint);color:var(--red);}
  form{background:var(--card-bg);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--radius-lg);padding:1.75rem;transition:background-color .3s var(--ease),box-shadow .3s var(--ease);}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
  .field .hint{font-size:12px;color:var(--text-tertiary);margin-top:6px;}
  input,select{width:100%;padding:11px 13px;border:1px solid transparent;border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--input-bg);color:var(--text);transition:background-color .2s var(--ease),box-shadow .2s var(--ease);}
  input:focus,select:focus{outline:none;box-shadow:0 0 0 3px var(--accent-tint-strong);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  button.primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:13px 22px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:var(--accent-glow);transition:background-color .2s var(--ease),transform .15s var(--ease);}
  button.primary:hover{background:var(--accent-hover);}
  button.primary:active{transform:scale(.98);}
  button.primary:disabled{opacity:.6;cursor:default;}
  .error{color:var(--red);font-size:12.5px;margin-top:6px;}
  .empty{text-align:center;color:var(--text-tertiary);padding:3rem 1rem;font-size:14px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--header-bg);color:#fff;padding:11px 20px;border-radius:var(--radius-sm);font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .toast.show{opacity:1;}
  .activity-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--hairline);font-size:13.5px;}
  .activity-item:last-child{border-bottom:none;}
  .activity-item .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .activity-item .activity-body{flex:1;min-width:0;}
  .activity-item .meta{color:var(--text-tertiary);font-size:11.5px;margin-top:2px;}
  .btn-delete-trigger{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:transparent;border:none;color:var(--text-tertiary);cursor:pointer;transition:background-color .2s var(--ease),color .2s var(--ease);}
  .btn-delete-trigger svg{width:15px;height:15px;}
  .btn-delete-trigger:hover{background:var(--red-tint);color:var(--red);}
  .delete-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;}
  .delete-confirm .pin-input{width:auto;flex:1;min-width:140px;padding:8px 11px;font-size:13px;}
  .delete-confirm .error{width:100%;margin-top:2px;}
  .btn-delete-confirm{background:var(--red);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s var(--ease);}
  .btn-delete-confirm:hover{opacity:.85;}
  .btn-delete-confirm:disabled{opacity:.6;cursor:default;}
  .btn-delete-cancel{background:transparent;color:var(--text-secondary);border:none;padding:8px 6px;font-size:13px;cursor:pointer;font-family:inherit;}
  .btn-delete-cancel:hover{color:var(--text);}
  .btn-cancel-text{background:transparent;color:var(--text-secondary);border:none;padding:8px 6px;font-size:13px;cursor:pointer;font-family:inherit;}
  .btn-cancel-text:hover{color:var(--text);}
  .item-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .btn-edit-trigger{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:transparent;border:none;color:var(--text-tertiary);cursor:pointer;transition:background-color .2s var(--ease),color .2s var(--ease);}
  .btn-edit-trigger svg{width:14px;height:14px;}
  .btn-edit-trigger:hover{background:var(--accent-tint);color:var(--accent);}
  .btn-editgate-confirm,.btn-edit-save{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background-color .2s var(--ease);}
  .btn-editgate-confirm:hover,.btn-edit-save:hover{background:var(--accent-hover);}
  .btn-edit-save:disabled{opacity:.6;cursor:default;}
  .edit-form{margin-top:12px;padding-top:14px;border-top:1px solid var(--hairline);}
  .edit-form .field{margin-bottom:12px;}
  .payout-card{background:var(--card-bg);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--radius-lg);padding:22px;margin-bottom:14px;transition:background-color .3s var(--ease),box-shadow .3s var(--ease);}
  .payout-card .name{font-weight:700;font-size:15.5px;}
  .payout-card .role{color:var(--text-secondary);font-size:12.5px;margin-bottom:12px;}
  .payout-card .amt{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--accent);text-shadow:var(--accent-glow);font-variant-numeric:tabular-nums;}
  @media (max-width:600px){.row2{grid-template-columns:1fr;}}
</style>
</head>

function getPreferredTheme(){
  try{
    const saved = localStorage.getItem('hpp_theme');
    if(saved === 'light' || saved === 'dark') return saved;
  }catch(e){}
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if(btn){ btn.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON; }
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem('hpp_theme', next); }catch(e){}
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');

function rowToSale(row){
  return {
    id: row.id, date: row.date, skuCode: row.sku_code, skuName: row.paddle_name,
    qty: row.qty, unitPrice: row.unit_price, total: row.total, customer: row.customer,
    channel: row.channel, soldBy: row.sold_by, status: row.status, paid: row.amount_paid,
    createdAt: row.created_at
  };
}

function rowToAudit(row){
  return {
    id: row.id, action: row.action, saleId: row.sale_id, skuCode: row.sku_code, skuName: row.paddle_name,
    qty: row.qty, unitPrice: row.unit_price, total: row.total, customer: row.customer,
    channel: row.channel, soldBy: row.sold_by, status: row.status, paid: row.amount_paid,
    changedBy: row.changed_by, changedAt: row.changed_at,
    previousValues: row.previous_values, newValues: row.new_values
  };
}

function recomputeInventory(){
  state.inventory = SKUS.map(s=>({...s, sold:0}));
  state.sales.forEach(sale=>{
    const inv = state.inventory.find(i=>i.code===sale.skuCode);
    if(inv) inv.sold += sale.qty;
  });
}

// Records a delete/edit into the sales_audit table (powers the History tab).
// Best-effort: if this fails, the underlying delete/edit itself already
// succeeded, so we don't want to block or roll that back over a logging issue.
async function logAudit(action, saleSnapshot, extra){
  extra = extra || {};
  try{
    await supabaseClient.from('sales_audit').insert([{
      action,
      sale_id: saleSnapshot.id,
      sku_code: saleSnapshot.skuCode,
      paddle_name: saleSnapshot.skuName,
      qty: saleSnapshot.qty,
      unit_price: saleSnapshot.unitPrice,
      total: saleSnapshot.total,
      customer: saleSnapshot.customer,
      channel: saleSnapshot.channel,
      sold_by: saleSnapshot.soldBy,
      status: saleSnapshot.status,
      amount_paid: saleSnapshot.paid,
      changed_by: currentUser || 'Unknown',
      previous_values: extra.previous || null,
      new_values: extra.next || null
    }]);
  }catch(e){ /* logging failure shouldn't surface to the user */ }
}

// Deletes require the same access PIN as inserts. The PIN is sent as a request
// header (not a column filter) and checked by a Supabase RLS policy on DELETE
// against each row's stored access_code — see the SQL note shipped alongside
// this file. Returns true only if a row was actually deleted.
async function deleteSale(id, pin){
  try{
    const pinClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      global: { headers: { 'x-pin': pin } }
    });
    const { data, error } = await pinClient
      .from('sales')
      .delete()
      .eq('id', id)
      .select(SALE_COLUMNS);
    if(error) return false;
    if(!data || !data.length) return false; // RLS silently excluded the row — wrong PIN
    const removed = rowToSale(data[0]);
    state.sales = state.sales.filter(s => String(s.id) !== String(id));
    recomputeInventory();
    await logAudit('delete', removed, {});
    if(!state.history) state.history = [];
    state.history.unshift({
      id: 'local-' + Date.now(), action: 'delete', saleId: removed.id,
      skuCode: removed.skuCode, skuName: removed.skuName, qty: removed.qty,
      unitPrice: removed.unitPrice, total: removed.total, customer: removed.customer,
      channel: removed.channel, soldBy: removed.soldBy, status: removed.status,
      paid: removed.paid, changedBy: currentUser || 'Unknown', changedAt: new Date().toISOString(),
      previousValues: null, newValues: null
    });
    return true;
  }catch(e){ return false; }
}

// Edits require the same access PIN, checked via the UPDATE RLS policy the
// same way deletes are. `changes` is a plain object of snake_case columns.
async function updateSale(id, changes, pin){
  try{
    const existing = state.sales.find(s => String(s.id) === String(id));
    const previousSnapshot = existing ? {...existing} : null;
    const pinClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      global: { headers: { 'x-pin': pin } }
    });
    const { data, error } = await pinClient
      .from('sales')
      .update(changes)
      .eq('id', id)
      .select(SALE_COLUMNS);
    if(error) return false;
    if(!data || !data.length) return false; // RLS silently excluded the row — wrong PIN
    const updated = rowToSale(data[0]);
    const idx = state.sales.findIndex(s => String(s.id) === String(id));
    if(idx !== -1) state.sales[idx] = updated; else state.sales.push(updated);
    recomputeInventory();
    await logAudit('edit', updated, { previous: previousSnapshot, next: updated });
    if(!state.history) state.history = [];
    state.history.unshift({
      id: 'local-' + Date.now(), action: 'edit', saleId: updated.id,
      skuCode: updated.skuCode, skuName: updated.skuName, qty: updated.qty,
      unitPrice: updated.unitPrice, total: updated.total, customer: updated.customer,
      channel: updated.channel, soldBy: updated.soldBy, status: updated.status,
      paid: updated.paid, changedBy: currentUser || 'Unknown', changedAt: new Date().toISOString(),
      previousValues: previousSnapshot, newValues: updated
    });
    return true;
  }catch(e){ return false; }
}

async function loadData(){
  try{
    const { data, error } = await supabaseClient
      .from('sales')
      .select(SALE_COLUMNS)
      .order('created_at', { ascending: true });
    if(error) throw error;
    state.sales = (data || []).map(rowToSale);
  }catch(e){ showToast("Couldn't load sales data"); }
  recomputeInventory();
  try{
    const { data, error } = await supabaseClient
      .from('sales_audit')
      .select('id,action,sale_id,sku_code,paddle_name,qty,unit_price,total,customer,channel,sold_by,status,amount_paid,changed_by,changed_at,previous_values,new_values')
      .order('changed_at', { ascending: true });
    if(error) throw error;
    state.history = (data || []).map(rowToAudit);
  }catch(e){ state.history = state.history || []; }
  try{
    const saved = localStorage.getItem('hpp_identity');
    if(saved) currentUser = saved;
  }catch(e){ /* not set yet */ }
}
async function saveIdentity(name){
  currentUser = name;
  try{ localStorage.setItem('hpp_identity', name); }catch(e){}
}

function initials(name){
  return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
}

function stockStatus(remaining){
  if(remaining <= 0) return {cls:'out', label:'Sold out'};
  if(remaining <= 3) return {cls:'low', label:'Low stock'};
  return {cls:'in', label:'In stock'};
}

function ambassadorCommission(name, unitsSoldByThem){
  // flat-rate by total volume tier, per JV Agreement Sec. 7
  let rate = 500;
  if(unitsSoldByThem >= 11) rate = 800;
  else if(unitsSoldByThem >= 6) rate = 650;
  return rate;
}

function computeTotals(){
  const totalReceived = state.inventory.reduce((a,s)=>a+s.qty,0);
  const totalSold = state.sales.reduce((a,s)=>a+s.qty,0);
  const totalRemaining = totalReceived - totalSold;
  const totalRevenue = state.sales.reduce((a,s)=>a+s.total,0);
  const totalOutstanding = state.sales.reduce((a,s)=>a+Math.max(0,s.total - s.paid),0);
  const totalCOGS = state.sales.reduce((a,s)=>{
    const sku = state.inventory.find(i=>i.code===s.skuCode);
    return a + (sku ? sku.landedCost * s.qty : 0);
  },0);

  const soldByPartner = {};
  PARTNERS.forEach(p=>soldByPartner[p]=0);
  const ambassadorSales = {};
  let totalCommission = 0;

  state.sales.forEach(s=>{
    if(PARTNERS.includes(s.soldBy)){
      soldByPartner[s.soldBy] += s.qty;
    } else {
      ambassadorSales[s.soldBy] = (ambassadorSales[s.soldBy]||0) + s.qty;
    }
  });
  Object.entries(ambassadorSales).forEach(([name, qty])=>{
    const rate = ambassadorCommission(name, qty);
    totalCommission += rate * qty;
  });

  const netProfit = totalRevenue - totalCOGS - totalCommission;
  const perPartner = netProfit / 3;

  return {totalReceived, totalSold, totalRemaining, totalRevenue, totalOutstanding, totalCOGS, totalCommission, netProfit, perPartner, soldByPartner, ambassadorSales};
}

function render(){
  renderNav();
  renderWho();
  const main = document.getElementById('main');
  main.classList.add('fade');
  setTimeout(()=>{
    if(activeTab === 'overview') main.innerHTML = renderOverview();
    else if(activeTab === 'inventory') main.innerHTML = renderInventory();
    else if(activeTab === 'sale') main.innerHTML = renderSaleForm();
    else if(activeTab === 'payouts') main.innerHTML = renderPayouts();
    else if(activeTab === 'salesLog') main.innerHTML = renderSalesLog();
    else if(activeTab === 'history') main.innerHTML = renderHistory();
    attachHandlers();
    requestAnimationFrame(()=>{ main.classList.remove('fade'); });
  }, 90);
}

function renderNav(){

function attachHandlers(){
  const priceSel = document.getElementById('f_price');
  if(priceSel){
    priceSel.onchange = ()=>{
      document.getElementById('customPriceField').style.display = priceSel.value === 'custom' ? 'block' : 'none';
    };
  }
  const soldBySel = document.getElementById('f_soldby');
  if(soldBySel){
    soldBySel.onchange = ()=>{
      document.getElementById('ambNameField').style.display = soldBySel.value === '__ambassador' ? 'block' : 'none';
    };
  }

  // Only one panel (delete-confirm / edit-gate / edit-form) is ever open per
  // sale row at a time, to avoid the confusing overlapping state that can
  // happen if a click lands ambiguously between two adjacent icon buttons.
  function closeItemPanels(id){
    const del = document.getElementById('delConfirm-' + id);
    const gate = document.getElementById('editGate-' + id);
    const form = document.getElementById('editForm-' + id);
    const view = document.getElementById('view-' + id);
    if(del) del.style.display = 'none';
    if(gate) gate.style.display = 'none';
    if(form) form.style.display = 'none';
    if(view) view.style.display = 'block';
  }

  document.querySelectorAll('.btn-delete-trigger').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      const panel = document.getElementById('delConfirm-' + id);
      const wasOpen = panel && panel.style.display !== 'none';
      closeItemPanels(id);
      if(panel) panel.style.display = wasOpen ? 'none' : 'flex';
    };
  });
  document.querySelectorAll('.btn-delete-cancel').forEach(btn=>{
    btn.onclick = ()=>{
      const panel = document.getElementById('delConfirm-' + btn.dataset.id);
      if(panel) panel.style.display = 'none';
    };
  });
  document.querySelectorAll('.btn-delete-confirm').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const pinInput = document.getElementById('delPin-' + id);
      const errBox = document.getElementById('delErr-' + id);
      const pin = pinInput ? pinInput.value : '';
      if(errBox) errBox.innerHTML = '';
      if(!pin){ if(errBox) errBox.innerHTML = '<div class="error">Enter the PIN.</div>'; return; }
      btn.disabled = true;
      const ok = await deleteSale(id, pin);
      btn.disabled = false;
      if(!ok){
        if(errBox) errBox.innerHTML = '<div class="error">Incorrect PIN.</div>';
        return;
      }
      showToast('Sale deleted');
      render();
    };
  });

  document.querySelectorAll('.btn-edit-trigger').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      const gate = document.getElementById('editGate-' + id);
      const wasOpen = gate && gate.style.display !== 'none';
      closeItemPanels(id);
      if(gate) gate.style.display = wasOpen ? 'none' : 'flex';
    };
  });
  document.querySelectorAll('.btn-editgate-cancel').forEach(btn=>{
    btn.onclick = ()=>{
      const gate = document.getElementById('editGate-' + btn.dataset.id);
      if(gate) gate.style.display = 'none';
    };
  });
  document.querySelectorAll('.btn-editgate-confirm').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      const pinInput = document.getElementById('editGatePin-' + id);
      const errBox = document.getElementById('editGateErr-' + id);
      if(errBox) errBox.innerHTML = '';
      if(!pinInput || !pinInput.value){ if(errBox) errBox.innerHTML = '<div class="error">Enter the PIN.</div>'; return; }
      // This first PIN entry just unlocks the edit form — it is not verified
      // against the database yet. The real check happens on Save, via the
      // UPDATE RLS policy, using the PIN entered there.
      document.getElementById('editGate-' + id).style.display = 'none';
      document.getElementById('view-' + id).style.display = 'none';
      document.getElementById('editForm-' + id).style.display = 'block';
    };
  });
  document.querySelectorAll('.btn-edit-cancel').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      document.getElementById('editForm-' + id).style.display = 'none';
      document.getElementById('view-' + id).style.display = 'block';
    };
  });
  document.querySelectorAll('.btn-edit-save').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const errBox = document.getElementById('editSaveErr-' + id);
      if(errBox) errBox.innerHTML = '';
      const qty = parseInt(document.getElementById('editQty-' + id).value, 10);
      const unitPrice = parseFloat(document.getElementById('editPrice-' + id).value);
      const customer = document.getElementById('editCustomer-' + id).value.trim();
      const channel = document.getElementById('editChannel-' + id).value.trim();
      const soldBy = document.getElementById('editSoldby-' + id).value.trim();
      const status = document.getElementById('editStatus-' + id).value;
      const pin = document.getElementById('editSavePin-' + id).value;
      if(!qty || qty < 1){ errBox.innerHTML = '<div class="error">Enter a valid quantity.</div>'; return; }
      if(!unitPrice || unitPrice <= 0){ errBox.innerHTML = '<div class="error">Enter a valid price.</div>'; return; }
      if(!customer){ errBox.innerHTML = '<div class="error">Enter the customer name.</div>'; return; }
      if(!soldBy){ errBox.innerHTML = '<div class="error">Enter who sold it.</div>'; return; }
      if(!pin){ errBox.innerHTML = '<div class="error">Enter the PIN.</div>'; return; }
      btn.disabled = true;
      const total = qty * unitPrice;
      const ok = await updateSale(id, {
        qty, unit_price: unitPrice, total, customer, channel, sold_by: soldBy, status
      }, pin);
      btn.disabled = false;
      if(!ok){
        errBox.innerHTML = '<div class="error">Incorrect PIN.</div>';
        return;
      }
      showToast('Sale updated');
      render();
    };
  });

  const form = document.getElementById('saleForm');
  if(form){
    form.onsubmit = async (e)=>{
      e.preventDefault();
      const errBox = document.getElementById('formError');
      errBox.innerHTML = '';
      if(!currentUser){
        errBox.innerHTML = '<div class="error">Select your name at the top before logging a sale.</div>';
        return;
      }
      const skuCode = document.getElementById('f_sku').value;
      const qty = parseInt(document.getElementById('f_qty').value, 10);
      const priceVal = document.getElementById('f_price').value;
      const customPrice = document.getElementById('f_customPrice').value;
      const unitPrice = priceVal === 'custom' ? parseFloat(customPrice) : parseFloat(priceVal);
      const customer = document.getElementById('f_customer').value.trim();
      const channel = document.getElementById('f_channel').value.trim();
      let soldBy = document.getElementById('f_soldby').value;
      const ambName = document.getElementById('f_ambname').value.trim();
      const status = document.getElementById('f_status').value;
      const paid = parseFloat(document.getElementById('f_paid').value || 0);
      const pin = document.getElementById('f_pin').value;

      if(!qty || qty < 1){ errBox.innerHTML = '<div class="error">Enter a valid quantity.</div>'; return; }
      if(!unitPrice || unitPrice <= 0){ errBox.innerHTML = '<div class="error">Enter a valid price.</div>'; return; }
      if(!customer){ errBox.innerHTML = '<div class="error">Enter the customer name.</div>'; return; }
      if(soldBy === '__ambassador'){
        if(!ambName){ errBox.innerHTML = '<div class="error">Enter the ambassador name.</div>'; return; }
        soldBy = ambName;
      }
      if(!pin){ errBox.innerHTML = '<div class="error">Enter the access PIN.</div>'; return; }
      const sku = state.inventory.find(s=>s.code===skuCode);
      const remaining = sku.qty - sku.sold;
      if(qty > remaining){ errBox.innerHTML = `<div class="error">Only ${remaining} left in stock for this paddle.</div>`; return; }

      const total = qty * unitPrice;
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      const { data, error } = await supabaseClient
        .from('sales')
        .insert([{
          date: today(), sku_code: skuCode, paddle_name: sku.name,
          qty, unit_price: unitPrice, total, customer, channel,
          sold_by: soldBy, status, amount_paid: Math.min(paid, total),
          access_code: pin
        }])
        .select(SALE_COLUMNS);

      submitBtn.disabled = false;

      if(error){
        const msg = (error.message || '').toLowerCase();
        if(error.code === '42501' || msg.includes('row-level security') || msg.includes('policy')){
          errBox.innerHTML = '<div class="error">Incorrect PIN. Please try again.</div>';
        } else {
          errBox.innerHTML = '<div class="error">Couldn\'t log the sale — try again.</div>';
        }
        return;
      }

      if(data && data[0]){ state.sales.push(rowToSale(data[0])); }
      recomputeInventory();
      showToast('Sale logged');
      activeTab = 'overview';
      render();
    };
  }
}

async function init(){
  applyTheme(getPreferredTheme());
  const themeBtn = document.getElementById('themeToggle');
  if(themeBtn){ themeBtn.onclick = toggleTheme; }
  await loadData();
  render();
}
init();
</script>
</body>
</html>
